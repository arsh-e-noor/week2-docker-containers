<!DOCTYPE html>
<html>
<head>
    <title>DevOps Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🚀 DevOps Monitoring Dashboard</h1>

    <div class="card">
        <h3>Server Status</h3>
        <p id="server"></p>
    </div>

    <div class="card">
        <h3>Docker Status</h3>
        <p id="docker"></p>
    </div>

    <div class="card">
        <h3>Pipeline Status</h3>
        <p id="pipeline"></p>
    </div>

    <div class="card">
        <h3>Environment</h3>
        <p id="environment"></p>
    </div>

    <div class="card">
        <h3>Current Time</h3>
        <p id="time"></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
